<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Estúdio Lunelle</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link rel="icon" type="image/x-icon" href="./assets/logo/WhatsApp Image 2026-10-28 at 12.00.47.jpeg">


    <script type="module" src="../JS/auth.js"></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="../index.html" class="logo">
            <span class="logo-icon">L</span>
            <span>Estúdio <strong>Lunelle</strong></span>
        </a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="eyebrow">FAÇA PARTE DA LUNELLE</span>
                <h1>Crie sua conta</h1>
                <p>Cadastre-se para ter uma experiência especial.</p>
            </div>

            <button type="button" class="google-button" id="googleRegister">
                <img src="../assets/icons/google.svg" alt="">
                Cadastrar com Google
            </button>

            <div class="auth-divider">
                <span>ou cadastre-se com seu e-mail</span>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo de 8 caracteres"
                        minlength="8" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar senha</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Digite sua senha novamente" minlength="8" autocomplete="new-password" required>
                </div>

                <label class="terms-checkbox">
                    <input type="checkbox" id="acceptTerms" required>
                    <span>
                        Li e aceito os termos de uso e a política de privacidade.
                    </span>
                </label>

                <button type="submit" class="btn btn-primary auth-submit">
                    Criar minha conta
                </button>

                <p id="registerMessage" class="form-message"></p>

            </form>

            <p class="auth-footer">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

        <a href="../index.html" class="back-home">
            ← Voltar para a loja
        </a>

    </main>

</body>

</html>
