<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Estúdio Lunelle</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link rel="icon" type="image/x-icon" href="./assets/logo/WhatsApp Image 2026-10-28 at 12.00.47.jpeg">


    <script type="module" src="../JS/auth.js"></script>
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="../index.html" class="logo">
            <span class="logo-icon">L</span>
            <span>Estúdio <strong>Lunelle</strong></span>
        </a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="eyebrow">BEM-VINDA DE VOLTA</span>
                <h1>Entre na sua conta</h1>
                <p>Acesse sua conta para acompanhar suas compras.</p>
            </div>

            <button type="button" class="google-button" id="googleLogin">
                <img src="../assets/icons/google.svg" alt="">
                Continuar com Google
            </button>

            <div class="auth-divider">
                <span>ou entre com seu e-mail</span>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha"
                        autocomplete="current-password" required>
                </div>

                <a href="#" id="forgotPassword" class="forgot-password">
                    Esqueceu sua senha?
                </a>

                <button type="submit" class="btn btn-primary auth-submit">
                    Entrar na minha conta
                </button>

                <p id="loginMessage" class="form-message"></p>

            </form>

            <p class="auth-footer">
                Ainda não possui uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

        </section>

        <a href="../index.html" class="back-home">
            ← Voltar para a loja
        </a>

    </main>

</body>

</html>
