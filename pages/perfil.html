<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta | Estúdio Lunelle</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/responsivo.css">
    <link rel="icon" type="image/x-icon" href="./assets/logo/WhatsApp Image 2026-10-28 at 12.00.47.jpeg">


    <script type="module" src="../JS/auth.js"></script>
</head>

<body>

    <header class="header">
        <div class="container navbar">

            <a href="../index.html" class="logo">
                <span class="logo-icon">L</span>
                <span>Estúdio <strong>Lunelle</strong></span>
            </a>

            <nav class="nav-links">
                <a href="../index.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="carrinho.html">Carrinho</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="profile-section">
            <div class="container">

                <div class="section-heading">
                    <span class="eyebrow">ÁREA DO CLIENTE</span>
                    <h1>Minha conta</h1>
                    <p>Gerencie suas informações pessoais.</p>
                </div>

                <div class="profile-card">

                    <div class="profile-avatar">
                        <img src="../assets/images/avatar-default.png" alt="Foto do cliente" id="profilePhoto">
                    </div>

                    <div class="profile-information">
                        <h2 id="profileName">Carregando...</h2>
                        <p id="profileEmail">Carregando e-mail...</p>
                    </div>

                    <div class="profile-details">

                        <div class="form-group">
                            <label for="profileNameInput">Nome</label>
                            <input type="text" id="profileNameInput" disabled>
                        </div>

                        <div class="form-group">
                            <label for="profileEmailInput">E-mail</label>
                            <input type="email" id="profileEmailInput" disabled>
                        </div>

                    </div>

                    <div class="profile-actions">

                        <a href="produtos.html" class="btn btn-outline">
                            Explorar produtos
                        </a>

                        <button type="button" class="btn btn-primary" id="logoutButton">
                            Sair da conta
                        </button>

                    </div>

                    <p id="profileMessage" class="form-message"></p>

                </div>

            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>© 2026 Estúdio Lunelle.</p>
            <span>Desenvolvido por <strong>EFDev</strong></span>
            <span class="version">BETA V1.0.0</span>
        </div>
    </footer>

</body>

</html>
